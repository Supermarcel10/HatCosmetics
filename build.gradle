plugins {
    id "java"
    id "com.github.johnrengelman.shadow" version "8.1.1"
    id "org.jetbrains.gradle.plugin.idea-ext" version "1.1.8"
    id "maven-publish"
}

group = "me.Tonus_"
version = "3.0.0"

repositories {
    mavenCentral()
    maven { url = "https://repo.papermc.io/repository/maven-public/" }
    mavenLocal()
}

dependencies {
    implementation "org.bstats:bstats-bukkit:3.0.2"
    implementation "org.reflections:reflections:0.10.2"
    compileOnly "io.papermc.paper:paper-api:1.16.5-R0.1-SNAPSHOT"
    compileOnly "org.jetbrains:annotations:24.1.0"
    compileOnly "org.projectlombok:lombok:1.18.32"
    annotationProcessor "org.projectlombok:lombok:1.18.32"
}

java {
    sourceCompatibility = JavaVersion.VERSION_16
    targetCompatibility = JavaVersion.VERSION_16

    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

idea {
    module {
        excludeDirs = [
                file(".gradle"),
                file("build"),
                file("gradle"),
                file("gradlew"),
                file("gradlew.bat")
        ]
    }
}

sourceSets {
    main {
        java {
            srcDirs = ["src/main/java"]
        }

        resources {
            srcDirs = ["src/main/resources/"]
        }
    }
}

build.dependsOn shadowJar
shadowJar {
    relocate "org.bstats", "${project.group}.shaded.org.bstats"
    archiveFileName.set("${project.name}-${project.version}.jar")

    manifest {
        attributes("Implementation-Version": project.version)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

tasks.register("copyToTestServer", Copy) {
    dependsOn "build"
    mustRunAfter "build"

    from "${project.buildDir}/libs"
    into "${project.projectDir}/src/main/test/server/plugins"
    include "*.jar"
}

tasks.register("runOnTestServer", Exec) {
    dependsOn "copyToTestServer"
    mustRunAfter "copyToTestServer"

    workingDir "${project.projectDir}/src/main/test/server/"
    commandLine "java", "-Xms1G", "-Xmx1G", "-Dpaper.log-level=WARN", "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005", "-jar", "paper-1.20.4-496.jar", "--nogui"
}
