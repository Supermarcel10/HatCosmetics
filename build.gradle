plugins {
    id 'java'
    id 'maven-publish'
}

group = 'me.Tonus_'
version = '2.1.2'

java {
    sourceCompatibility = JavaVersion.VERSION_16
    targetCompatibility = JavaVersion.VERSION_16

    toolchain.languageVersion.set(JavaLanguageVersion.of(21))
}

sourceSets {
    main {
        java.srcDirs = ["src/main/java"]
        resources.srcDirs = ["src/main/resources/"]
    }
    test {
        java.srcDirs = ["src/test/java"]
        resources.srcDirs = ["src/test/resources/"]
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url = 'https://repo.codemc.org/repository/maven-public/' }
    maven { url = 'https://oss.sonatype.org/content/repositories/snapshots' }
    maven { url = 'https://oss.sonatype.org/content/repositories/central' }
    mavenLocal()
}

dependencies {
    // Build
    implementation 'org.jetbrains:annotations:24.1.0'
    compileOnly 'de.tr7zw:item-nbt-api-plugin:2.12.3'
    compileOnly 'org.spigotmc:spigot-api:1.16.5-R0.1-SNAPSHOT'
    compileOnly 'com.google.code.gson:gson:2.13.1' // CVE mitigation: spigot-api
    compileOnly 'com.google.guava:guava:33.2.1-jre' // CVE mitigation: spigot-api
    compileOnly 'org.yaml:snakeyaml:2.2' // CVE mitigation: spigot-api

    // Testing
    testImplementation platform("org.junit:junit-bom:5.13.1")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "org.mockito:mockito-core:5.18.0"

    testImplementation "org.spigotmc:spigot-api:1.16.5-R0.1-SNAPSHOT"
    testImplementation "com.google.code.gson:gson:2.13.1"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }

    doFirst {
        def mockitoJar = configurations.testRuntimeClasspath.find {
            it.name.startsWith("mockito-core")
        }
        if (mockitoJar) jvmArgs "-javaagent:${mockitoJar}", "-Xshare:off"
    }
}
