# HatCosmetics config version: 5
version: 5
# DO NOT EDIT THE CONFIG VERSION ABOVE!

# ----------------------------------------
# Storage Configuration
# ----------------------------------------
locale:
  # Default server locale
  # This is the language displayed in the plugin's messages, if the player's locale is not supported
  server-locale: en_US

  # Force server locale
  force-locale: false


# ----------------------------------------
# Storage Configuration
# ----------------------------------------
storage:
  # The data pattern/format to save files in
  format: YML


# ----------------------------------------
# GUI Configuration
# ----------------------------------------
gui:
  # The number of cosmetic rows in the GUI (must be between 1 and 4, or -1 for auto)
  rows: 3

  # The GUI item configuration
  # Refer to Spigot-API Materials for list of items: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html
  items:
    # Border item for the GUI
    border: LIGHT_BLUE_STAINED_GLASS_PANE

    # Next page item
    next-page: ARROW

    # Previous page item
    previous-page: ARROW

    # Close GUI item
    close: BARRIER

  # Hide hats that players do not have access to.
  # If set to true, players will only see hats they have access to in the GUI.
  hide-hats: false


# ----------------------------------------
# Cosmetic Configuration
# ----------------------------------------
hats:
  # The default hat to equip when a player joins without one.
  # Set to a cosmetic name (e.g. "staff_hat") or "NONE" to disable.
  default-hat: NONE

  # Allow cosmetics to be overlaid on top of armour?
  allow-overlays: true

  # Will player keep their cosmetic on death?
  keep-on-death: true
