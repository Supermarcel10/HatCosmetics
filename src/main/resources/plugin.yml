main: me.Tonus_.hatCosmetics.Main
name: HatCosmetics
website: https://github.com/Supermarcel10/HatCosmetics/
version: ${pluginVersion}
api-version: 1.16
load: STARTUP
folia-supported: true
description: A simple plugin that allows players to wear hats.
authors:
  - Supermarcel10
  - Tonus_

permissions:
  hatcosmetics.reload:
    description: Allows reloading the plugin configuration and hats.
    default: op
  hatcosmetics.admin.equip.other:
    description: Allows equipping cosmetics on other players.
    default: op
  hatcosmetics.admin.unequip.other:
    description: Allows unequipping cosmetics from other players.
    default: op
  hatcosmetics.hat.*:
    description: Grants access to all cosmetics.
    default: true
