version: 4
# HatCosmetics messages version: 4

# This is a template file for all plugin's messages.
# You can create a new file in the same directory and name it whatever you want, or rename this one.
# The name of the file will be the name of the locale. For example, ABC.yml will be locale "ABC".
# To make the plugin use your locale, change the "locale" options in the config.yml to the name of your locale.

# Colour codes are supported. Use '&' followed by a number or letter to change the format of the text.
# See https://minecraft.gamepedia.com/Formatting_codes for more information.

# Translation by:

# Placeholders:
# {cosmetic} - Returns the name of the equipped/unequipped cosmetic
# {player} - Returns the name of the target player

gui:
